<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{% endblock %} · Conversor de Bases</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ url_for('inicio') }}">Conversor de Bases</a>
    <nav>
      <a href="{{ url_for('inicio') }}" {% if request.endpoint == 'inicio' %}aria-current="page"{% endif %}>Início</a>
      <a href="{{ url_for('pagina_conversor') }}" {% if request.endpoint == 'pagina_conversor' %}aria-current="page"{% endif %}>Conversor</a>
      <a href="{{ url_for('grupo') }}" {% if request.endpoint == 'grupo' %}aria-current="page"{% endif %}>Grupo</a>
    </nav>
  </header>
  <main>{% block conteudo %}{% endblock %}</main>
  <footer class="rodape">Redes de Computadores 1 · Sistemas de Informação</footer>
</body>
</html>
